# Local AI agent swarm knowledge graph: Ollama + the swarm-kg service.
# Works with Docker and Podman (podman compose up -d).

volumes:
  ollama_data:

networks:
  swarm_net:
    driver: bridge

services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      - swarm_net
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  swarm-kg:
    build: .
    container_name: swarm-kg
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - swarm_net
    ports:
      # Published on the host's loopback only, so nobody else on the network
      # can send captures or read notes.
      - "127.0.0.1:${PORT:-5678}:5678"
    environment:
      # Inside the container the service must listen on every interface, or
      # the published port can't reach it. The loopback-only publish above is
      # what keeps it private.
      HOST: "0.0.0.0"
      PORT: "5678"
      VAULT_PATH: /vault
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-large}
      RESEARCHER_ENABLED: ${RESEARCHER_ENABLED:-false}
      NOTE_MAX_CHARS: ${NOTE_MAX_CHARS:-20000}
    volumes:
      # Mount your Obsidian vault here. Set VAULT_HOST_PATH in .env.
      - ${VAULT_HOST_PATH:-./vault}:/vault
